android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Chartboost Monetization SDK + host Prebid SDK versions this adapter compiles against. They also feed
# the adapter version computed in the root build.gradle.kts (stamped into BuildConfig.ADAPTER_VERSION).
chartboostSdkVersion=9.12.0
prebidMobileVersion=3.3.1

# Adapter revision: the per-release counter for a given (Prebid major, Monetization version) pair.
# BuildConfig.ADAPTER_VERSION = (prebidMajor*100 + monMajor).(monMinor).(monPatch*100 + adapterRevision).
# The Prebid Server adapter echoes this value back from the request, so no lock-step release is needed.
adapterRevision=0
