android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Chartboost Monetization SDK + host Prebid SDK versions this adapter compiles against. They also feed
# the adapter version computed in the root build.gradle.kts (stamped into BuildConfig.ADAPTER_VERSION).
chartboostSdkVersion=9.14.0
prebidMobileVersion=3.4.0

# Adapter revision: the per-release counter for a given (Prebid major, Monetization major.minor) pair.
# BuildConfig.ADAPTER_VERSION = (prebidMajor*100 + monMajor).(monMinor).(adapterRevision). The Monetization
# patch is not encoded, as on iOS: the adapter supports every patch of its minor.
# The Prebid Server adapter echoes this value back from the request, so no lock-step release is needed.
adapterRevision=0
