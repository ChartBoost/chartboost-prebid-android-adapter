name: 'Set up JDK'
description: 'Sets up JDK 17 (Temurin) with Gradle caching and grants execute permission for gradlew'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
